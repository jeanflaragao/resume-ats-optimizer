# Local development only. Production deploys go through Kamal (see
# config/deploy.yml and the root Dockerfile), which doesn't use this file.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ENABLE_REAL_LLM_CALLS: ${ENABLE_REAL_LLM_CALLS:-false}
      MAX_LLM_CALLS_PER_DAY: ${MAX_LLM_CALLS_PER_DAY:-10}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID_5_CREDITS: ${STRIPE_PRICE_ID_5_CREDITS}
      STRIPE_PRICE_ID_15_CREDITS: ${STRIPE_PRICE_ID_15_CREDITS}
      STRIPE_PRICE_ID_UNLIMITED_30_DAYS: ${STRIPE_PRICE_ID_UNLIMITED_30_DAYS}
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  db_data:
  bundle_data:
