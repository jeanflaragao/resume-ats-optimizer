# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Issue #76. A successful download deletes its own request, so this only ever
  # collects two things: requests whose job failed, and requests the queue never
  # got to. Neither is cleaned up by the task above -- a failed job is not
  # "finished" (Solid Queue creates a FailedExecution and stops), which is how
  # the plaintext job descriptions this replaced came to have no retention bound
  # at all.
  #
  # Every five minutes against a fifteen-minute window: the schedule is the
  # error term on the retention promise, so a row lives at most ~20 minutes
  # rather than exactly 15. Resume::PdfRequest::PURGE_AFTER carries the
  # derivation of the window itself.
  purge_stale_pdf_requests:
    command: "Resume::PdfRequest.purge_stale!"
    schedule: every 5 minutes

  # Issue #22. Unlike the purge above, nothing here is time-critical: these rows
  # hold no user content, only a session token, an action name and a count, and
  # Usage::Counter::RETAIN_FOR keeps six days of slack over the one-day period
  # they enforce. Daily rather than five-minutely because the point is to stop
  # the table growing without bound, not to shorten an exposure window -- and
  # because a subject's expired counters are the only history available for
  # sizing the production limits, so deleting them promptly would be actively
  # unhelpful.
  purge_stale_usage_counters:
    command: "Usage::Counter.purge_stale!"
    schedule: every day at 3:17am
