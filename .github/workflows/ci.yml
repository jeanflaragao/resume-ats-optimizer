name: CI

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install packages
        # poppler-utils: pdftotext, used by Resume::Extractors::Llm#source_text (issue #126) --
        # this job runs directly on the runner, not the Dockerfile image, so it needs its own copy.
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config google-chrome-stable poppler-utils

      - name: Remove the runner's pre-installed chromedriver
        # google-chrome-stable above installs whatever Chrome is currently "stable" via apt,
        # independent of the chromedriver version baked into the runner image -- the two can
        # (and did, issue #138) drift apart, which made Capybara's attach_file report a
        # perfectly enabled file input as "disabled". Selenium 4's own Selenium Manager
        # auto-downloads a chromedriver matched to whatever Chrome is actually installed, but
        # only when it can't find one on PATH first; deleting the stale one here is what
        # Selenium's own drift warning recommends.
        run: sudo rm -f /usr/bin/chromedriver

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        # db:test:prepare doesn't exist in Rails 8 (was going to fail CI as originally
        # generated) -- db:prepare is the correct task, and RAILS_ENV=test above scopes
        # it to the test database. SimpleCov's minimum_coverage 90 (test/test_helper.rb)
        # already fails this step's exit code if coverage drops below threshold.
        run: bin/rails db:prepare test test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
